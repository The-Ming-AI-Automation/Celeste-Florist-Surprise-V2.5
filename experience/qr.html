<!doctype html>
<html lang="zh-MY">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Private Surprise Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="qr.css" />
</head>
<body>
  <main class="invitation-page">
    <article class="invitation-card">
      <div class="card-glow" aria-hidden="true"></div>
      <div class="language-switch" aria-label="Language selector">
        <button data-lang="zh" type="button">中文</button><span>·</span>
        <button data-lang="en" type="button">EN</button><span>·</span>
        <button data-lang="bm" type="button">BM</button>
      </div>
      <p class="invitation-label" id="invitation-label"></p>
      <h1 id="invitation-title"></h1>
      <div class="qr-frame">
        <img id="qr-image" alt="QR code that opens the private surprise" />
        <span class="qr-mark">♥</span>
      </div>
      <p class="scan-instruction" id="scan-instruction"></p>
      <p class="microphone-note" id="microphone-note"></p>
      <a class="open-button" id="open-button" href="#"><span id="open-button-label"></span><span>→</span></a>
      <p class="card-signature">— <span id="card-sender"></span></p>
    </article>
    <button class="print-button" id="print-button" type="button">Print / Save as PDF</button>
  </main>
  <script src="client-config.js"></script>
  <script src="qr.js"></script>
</body>
</html>
